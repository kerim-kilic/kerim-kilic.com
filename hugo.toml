baseURL = "https://kerim-kilic.com/"
locale = "en"
title = "Kerim Kilic"
enableRobotsTXT = true

[pagination]
  pagerSize = 10

[params]
  role = "Lead Cloud Engineer"
  description = "Kerim Kilic, cloud engineer. Articles about AWS, Terraform and cloud networking, and notes on things I've built."
  email = "hello@kerim-kilic.com"
  linkedin = "https://www.linkedin.com/in/kerim-kilic/"
  github = "https://github.com/kerim-kilic"

[menus]
  # Every menu item scrolls to a section on the home page. The full article list, the articles and the project
  # write-ups keep their own pages, linked from those sections.
  [[menus.main]]
    name = "About"
    url = "/#about"
    weight = 10
  [[menus.main]]
    name = "Projects"
    url = "/#projects"
    weight = 20
  [[menus.main]]
    name = "Articles"
    url = "/#articles"
    weight = 30
  [[menus.main]]
    name = "Contact"
    url = "/#contact"
    weight = 40

[minify]
  # Keep HTML unminified: the minifier decodes the character references that hide the email address.
  disableHTML = true

[markup]
  [markup.highlight]
    noClasses = true
    style = "github-dark"
    lineNos = false
  [markup.goldmark.renderer]
    unsafe = false

[taxonomies]
  tag = "tags"

[outputs]
  home = ["html", "rss"]
