<header class="site-header">
  <div class="container bar">
    <a class="brand" href="{{ "/" | relURL }}">{{ site.Title }}</a>
    <nav aria-label="Main">
      {{ $current := . }}
      <ul>
        {{ range site.Menus.main }}
        <li><a href="{{ .URL }}"{{ if or ($current.IsMenuCurrent "main" .) ($current.HasMenuCurrent "main" .) }} aria-current="page"{{ end }}>{{ .Name }}</a></li>
        {{ end }}
      </ul>
    </nav>
    {{- /* Hidden until assets/js/theme.js shows it; without JavaScript the site follows the system setting. */}}
    <button class="theme-toggle" type="button" data-next="dark" hidden>
      <svg class="icon i-light" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <svg class="icon i-dark" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
      <span class="theme-label sr-only">Switch colour theme</span>
    </button>
  </div>
</header>
