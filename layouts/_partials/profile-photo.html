{{- /* Context: dict with "class" and "sizes" (the CSS display width, e.g. "144px"). */ -}}
{{- with resources.Get "images/profile.jpg" -}}
  {{- $small := .Resize "240x webp q85" -}}
  {{- $large := .Resize (printf "%dx webp q85" (math.Min 480 .Width | int)) -}}
  <img class="portrait {{ $.class }}"
       src="{{ $small.RelPermalink }}"
       srcset="{{ $small.RelPermalink }} 240w, {{ $large.RelPermalink }} {{ $large.Width }}w"
       sizes="{{ $.sizes }}"
       width="{{ $small.Width }}" height="{{ $small.Height }}"
       alt="Kerim Kilic" decoding="async">
{{- end -}}
