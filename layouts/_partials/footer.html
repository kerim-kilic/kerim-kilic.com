<footer class="site-footer">
  <div class="container bar">
    <p>© {{ now.Year }} {{ site.Title }} · Views expressed here are my own, not my employer's. · <a href="{{ "privacy/" | relURL }}">Privacy</a></p>
    <ul class="social">
      <li><a {{ printf `href="mailto:%s"` (partial "email.html" .) | safeHTMLAttr }} aria-label="Email" title="Email">{{ partial "icon.html" "envelope" }}</a></li>
      <li><a href="{{ site.Params.linkedin }}" rel="me noopener" aria-label="LinkedIn" title="LinkedIn">{{ partial "icon.html" "linkedin" }}</a></li>
      <li><a href="{{ site.Params.github }}" rel="me noopener" aria-label="GitHub" title="GitHub">{{ partial "icon.html" "github" }}</a></li>
      <li><a href="{{ "index.xml" | relURL }}" aria-label="RSS feed" title="RSS feed">{{ partial "icon.html" "rss" }}</a></li>
    </ul>
  </div>
</footer>
