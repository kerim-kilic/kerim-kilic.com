<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 466" font-size="13" role="img" aria-label="Lab results for an IPv6-only instance, in four steps. Sites and AWS dual-stack endpoints with an IPv6 address work in every step. IPv4-only sites, the AWS CLI's default endpoints and S3's default name fail at once with only the egress-only gateway, hang once DNS64 is on, and work through NAT64 once 64:ff9b::/96 is routed to the NAT gateway. With VPC endpoints, both the default and the dual-stack STS and Systems Manager names go through the interface endpoints, S3's dual-stack name through the gateway endpoint and ECR's dual-stack registry name through the ECR endpoints, but S3's default name and image layers pulled through ECR's default registry name still go through NAT64.">
<defs>
<marker id="v6r-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker>
<marker id="v6r-arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#e5534b"/></marker>
</defs>
<!-- Measured 2026-11-08, aws-ipv6-lab. Cells: green = works, amber = NAT64 (charged per GB), red = fails. -->
