<text x="579.0" y="52" font-size="11" font-weight="600" text-anchor="middle" fill="currentColor">3. + route to NAT64</text>
<text x="717.0" y="52" font-size="11" font-weight="600" text-anchor="middle" fill="currentColor">4. + VPC endpoints</text>
