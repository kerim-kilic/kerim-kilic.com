  <!-- AWS Architecture Icons (CloudFront, S3, IAM) (c) Amazon Web Services, Inc. Embedded unmodified, scaled only. https://aws.amazon.com/architecture/icons/ -->

  <!-- Trigger -->
  <rect x="10" y="128" width="80" height="52" rx="8" style="fill:var(--surface)" stroke="currentColor" stroke-opacity=".55" stroke-width="1.2"/>
  <text x="50" y="151" text-anchor="middle" font-weight="600" fill="currentColor">git push</text>
  <text x="50" y="168" text-anchor="middle" font-size="11" style="fill:var(--muted)">to main</text>
  <line x1="90" y1="154" x2="146" y2="154" stroke="currentColor" stroke-width="1.4" marker-end="url(#dp-arrow)"/>
  <text x="118" y="145" text-anchor="middle" font-size="11" fill="currentColor">triggers</text>

  <!-- Runner -->
  <rect x="150" y="44" width="222" height="264" rx="10" fill="none" stroke="currentColor" stroke-opacity=".5" stroke-dasharray="5 4"/>
  <text x="164" y="64" font-size="11" style="fill:var(--muted)">GitHub Actions runner</text>

  <rect x="164" y="80" width="194" height="36" rx="6" style="fill:var(--surface)" stroke="currentColor" stroke-opacity=".55" stroke-width="1.2"/>
  <text x="261" y="103" text-anchor="middle" fill="currentColor">1  hugo --minify</text>
  <rect x="164" y="136" width="194" height="36" rx="6" style="fill:var(--surface)" stroke="currentColor" stroke-opacity=".55" stroke-width="1.2"/>
  <text x="261" y="159" text-anchor="middle" fill="currentColor">2  assume the deploy role</text>
  <rect x="164" y="200" width="194" height="36" rx="6" style="fill:var(--surface)" stroke="currentColor" stroke-opacity=".55" stroke-width="1.2"/>
  <text x="261" y="223" text-anchor="middle" fill="currentColor">3  sync public/ to S3</text>
  <rect x="164" y="256" width="194" height="36" rx="6" style="fill:var(--surface)" stroke="currentColor" stroke-opacity=".55" stroke-width="1.2"/>
  <text x="261" y="279" text-anchor="middle" fill="currentColor">4  invalidate the cache</text>

  <line x1="261" y1="116" x2="261" y2="134" stroke="currentColor" stroke-width="1.4" marker-end="url(#dp-arrow)"/>
  <line x1="261" y1="172" x2="261" y2="198" stroke="currentColor" stroke-width="1.4" marker-end="url(#dp-arrow)"/>
  <line x1="261" y1="236" x2="261" y2="254" stroke="currentColor" stroke-width="1.4" marker-end="url(#dp-arrow)"/>

  <!-- STS: the mechanism the argument rests on -->
  <rect x="520" y="122" width="270" height="64" rx="8" style="fill:var(--surface);stroke:var(--accent)" stroke-width="2"/>
  <use href="#dp-iam" x="532" y="134" width="40" height="40"/>
  <text x="683" y="143" text-anchor="middle" font-weight="600" fill="currentColor">AWS STS + deploy role</text>
  <text x="683" y="160" text-anchor="middle" font-size="11" fill="currentColor">trust: this repo, main branch only</text>
  <text x="683" y="176" text-anchor="middle" font-size="11" fill="currentColor">write one bucket, clear the cache</text>
  <line x1="358" y1="146" x2="516" y2="146" stroke="currentColor" stroke-width="1.4" marker-end="url(#dp-arrow)"/>
  <text x="444" y="138" text-anchor="middle" font-size="11" fill="currentColor">OIDC token</text>
  <line x1="516" y1="164" x2="362" y2="164" stroke="currentColor" stroke-width="1.4" marker-end="url(#dp-arrow)"/>
  <text x="444" y="180" text-anchor="middle" font-size="11" fill="currentColor">temporary credentials</text>

  <!-- Targets -->
  <rect x="520" y="200" width="270" height="36" rx="8" style="fill:var(--surface)" stroke="currentColor" stroke-opacity=".55" stroke-width="1.2"/>
  <use href="#dp-s3" x="528" y="204" width="28" height="28"/>
  <text x="675" y="223" text-anchor="middle" fill="currentColor">S3 bucket</text>
  <line x1="358" y1="218" x2="516" y2="218" stroke="currentColor" stroke-width="1.4" marker-end="url(#dp-arrow)"/>
  <text x="444" y="210" text-anchor="middle" font-size="11" fill="currentColor">upload, delete stale</text>

  <rect x="520" y="256" width="270" height="36" rx="8" style="fill:var(--surface)" stroke="currentColor" stroke-opacity=".55" stroke-width="1.2"/>
  <use href="#dp-cf" x="528" y="260" width="28" height="28"/>
  <text x="675" y="279" text-anchor="middle" fill="currentColor">CloudFront distribution</text>
  <line x1="358" y1="274" x2="516" y2="274" stroke="currentColor" stroke-width="1.4" marker-end="url(#dp-arrow)"/>
  <text x="444" y="266" text-anchor="middle" font-size="11" fill="currentColor">invalidate /*</text>
</svg>
