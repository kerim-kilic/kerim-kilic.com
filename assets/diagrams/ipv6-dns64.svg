<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" font-size="13" role="img" aria-label="An application on an IPv6-only instance asks Route 53 Resolver for the AAAA record of github.com. The name has only an A record, 203.0.113.10, so Resolver, with DNS64 on for the subnet, synthesises the AAAA answer 64:ff9b::cb00:710a: the IPv4 address written into the last 32 bits of the well-known prefix 64:ff9b::/96. Names with a real AAAA record get that record unchanged.">
