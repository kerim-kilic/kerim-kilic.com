<rect x="20" y="40" width="190" height="104" rx="8" class="d-surface" stroke="currentColor" stroke-opacity=".55" stroke-width="1.2"/>
<use href="#v6l-ec2" x="101" y="52" width="28" height="28"/>
<text x="115" y="100" font-weight="600" text-anchor="middle" fill="currentColor">Instance</text>
<text x="115" y="118" font-size="11" text-anchor="middle" class="d-muted">IPv6-only subnet</text>
<text x="115" y="133" font-size="11" text-anchor="middle" class="d-muted">wants github.com</text>
<rect x="305" y="40" width="190" height="104" rx="8" class="d-surface" stroke="currentColor" stroke-opacity=".55" stroke-width="1.2"/>
<use href="#v6l-vpc" x="386" y="52" width="28" height="28"/>
<text x="400" y="100" font-weight="600" text-anchor="middle" fill="currentColor">Route 53 Resolver</text>
<text x="400" y="118" font-size="11" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" class="d-muted">fd00:ec2::253</text>
<text x="400" y="133" font-size="11" text-anchor="middle" class="d-muted">DNS64 on for the subnet</text>
<rect x="590" y="40" width="190" height="104" rx="8" class="d-surface" stroke="currentColor" stroke-opacity=".55" stroke-width="1.2"/>
<text x="685" y="72" font-weight="600" text-anchor="middle" fill="currentColor">github.com in DNS</text>
<text x="685" y="95" font-size="12" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="currentColor">A     203.0.113.10</text>
<text x="685" y="115" font-size="12" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#e5534b">AAAA  none</text>
<text x="685" y="133" font-size="11" text-anchor="middle" class="d-muted">(IPv4 only)</text>
<polyline points="210,70 301,70" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#v6l-arrow)"/>
<text x="222" y="62" font-size="11" fill="currentColor">1  AAAA?</text>
<polyline points="495,70 586,70" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#v6l-arrow)"/>
<text x="507" y="62" font-size="11" fill="currentColor">2  AAAA? A?</text>
<polyline points="590,120 499,120" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#v6l-arrow)"/>
<text x="512" y="138" font-size="11" fill="currentColor">3  A only</text>
<polyline points="305,120 214,120" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#v6l-arrow)"/>
<text x="222" y="138" font-size="11" fill="currentColor">4  synthesised</text>
<rect x="20" y="176" width="760" height="112" rx="8" class="d-accent d-stroke-accent" fill-opacity=".08" stroke-width="1.2"/>
<text x="36" y="200" font-weight="600" fill="currentColor">The synthesised AAAA answer: the IPv4 address, written into the last 32 bits of 64:ff9b::/96</text>
<text x="36" y="228" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="currentColor">64:ff9b::</text>
<text x="122" y="228" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="currentColor">+  203.0.113.10</text>
<text x="300" y="228" font-size="14" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="currentColor">=  64:ff9b::cb00:710a</text>
<text x="530" y="228" font-size="11" class="d-muted">also written 64:ff9b::203.0.113.10</text>
<text x="36" y="252" font-size="11" class="d-muted">203 = cb, 0 = 00, 113 = 71, 10 = 0a. The NAT gateway reads the IPv4 address back out of the last 32 bits.</text>
<text x="36" y="272" font-size="11" class="d-muted">A name with a real AAAA record (pypi.org, s3.dualstack..., sts.us-east-1.api.aws) gets that record, unchanged.</text>
</svg>
