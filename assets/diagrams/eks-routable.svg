<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 404" font-size="13" role="img" aria-label="A VPC with a routable range, 10.20.0.0/24, holding the nodes, an internal load balancer and a NAT gateway, and a secondary range, 100.64.0.0/16, holding the pods. Outbound traffic from a pod is translated to the node's address, so it reaches other private networks directly and the internet through the NAT gateway. Inbound traffic arrives through the load balancer. Other private networks have no route to the 100.64 range itself.">
