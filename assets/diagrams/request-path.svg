  <!-- AWS Architecture Icons (CloudFront, S3, IAM) (c) Amazon Web Services, Inc. Embedded unmodified, scaled only. https://aws.amazon.com/architecture/icons/ -->

  <!-- Visitor -->
  <rect x="10" y="133" width="100" height="60" rx="8" style="fill:var(--surface)" stroke="currentColor" stroke-opacity=".55" stroke-width="1.2"/>
  <text x="60" y="160" text-anchor="middle" font-weight="600" fill="currentColor">Visitor</text>
  <text x="60" y="177" text-anchor="middle" font-size="11" style="fill:var(--muted)">browser</text>

  <!-- 1. DNS lookup -->
  <rect x="150" y="14" width="180" height="54" rx="8" style="fill:var(--surface)" stroke="currentColor" stroke-opacity=".55" stroke-width="1.2"/>
  <text x="240" y="37" text-anchor="middle" font-weight="600" fill="currentColor">Cloudflare DNS</text>
  <text x="240" y="55" text-anchor="middle" font-size="11" style="fill:var(--muted)">CNAME, DNS only</text>
  <polyline points="60,133 60,41 146,41" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#rp-arrow)"/>
  <text x="68" y="92" font-size="11" fill="currentColor">1  DNS lookup</text>

  <!-- CloudFront -->
  <rect x="170" y="84" width="400" height="136" rx="10" fill="none" stroke="currentColor" stroke-opacity=".5" stroke-dasharray="5 4"/>
  <use href="#rp-cf" x="182" y="92" width="26" height="26"/>
  <text x="216" y="110" font-size="11" style="fill:var(--muted)">CloudFront distribution · TLS with an ACM certificate</text>

  <rect x="186" y="125" width="150" height="76" rx="6" style="fill:var(--surface)" stroke="currentColor" stroke-opacity=".55" stroke-width="1.2"/>
  <text x="261" y="148" text-anchor="middle" font-weight="600" fill="currentColor">CloudFront Function</text>
  <text x="261" y="167" text-anchor="middle" font-size="11" fill="currentColor">www → apex redirect</text>
  <text x="261" y="183" text-anchor="middle" font-size="11" fill="currentColor">/x/ → /x/index.html</text>

  <rect x="386" y="125" width="168" height="76" rx="6" style="fill:var(--surface)" stroke="currentColor" stroke-opacity=".55" stroke-width="1.2"/>
  <text x="470" y="148" text-anchor="middle" font-weight="600" fill="currentColor">Edge cache</text>
  <text x="470" y="167" text-anchor="middle" font-size="11" fill="currentColor">hit: answer from cache</text>
  <text x="470" y="183" text-anchor="middle" font-size="11" fill="currentColor">miss: fetch from origin</text>

  <line x1="336" y1="163" x2="382" y2="163" stroke="currentColor" stroke-width="1.4" marker-end="url(#rp-arrow)"/>

  <!-- 2. Browser to CloudFront -->
  <line x1="110" y1="163" x2="182" y2="163" stroke="currentColor" stroke-width="1.4" marker-end="url(#rp-arrow)"/>
  <text x="140" y="154" text-anchor="middle" font-size="11" fill="currentColor">2  HTTPS</text>

  <!-- 3. Origin -->
  <rect x="660" y="111" width="130" height="104" rx="8" style="fill:var(--surface)" stroke="currentColor" stroke-opacity=".55" stroke-width="1.2"/>
  <use href="#rp-s3" x="709" y="119" width="32" height="32"/>
  <text x="725" y="171" text-anchor="middle" font-weight="600" fill="currentColor">S3 bucket</text>
  <text x="725" y="187" text-anchor="middle" font-size="11" fill="currentColor">private; only this</text>
  <text x="725" y="203" text-anchor="middle" font-size="11" fill="currentColor">distribution may read</text>
  <line x1="554" y1="163" x2="656" y2="163" stroke="currentColor" stroke-width="1.4" marker-end="url(#rp-arrow)"/>
  <text x="615" y="153" text-anchor="middle" font-size="11" fill="currentColor">3  on a miss</text>
  <text x="615" y="183" text-anchor="middle" font-size="11" fill="currentColor">signed by OAC</text>

  <!-- Denied direct path -->
  <polyline points="60,193 60,270 725,270 725,252" fill="none" stroke="#e5534b" stroke-width="1.4" stroke-dasharray="6 4"/>
  <line x1="717" y1="228" x2="733" y2="244" stroke="#e5534b" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="733" y1="228" x2="717" y2="244" stroke="#e5534b" stroke-width="2.2" stroke-linecap="round"/>
  <text x="392" y="262" text-anchor="middle" font-size="11" fill="#e5534b">direct request to the bucket: denied by Block Public Access</text>
</svg>
