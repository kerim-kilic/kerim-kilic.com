name: Terraform checks

# Format and validity checks for the Terraform code. They need no cloud credentials and never plan or apply anything.
# They run on every push to any branch (no path filter), so they can be required checks on main: a pull request's head
# commit has always been pushed first, so the push run reports on it, and GitHub matches required checks by commit.
# A pull_request trigger as well would only run everything twice. A path-filtered check would never report on a pull
# request that doesn't touch terraform/ and would block its merge.
on:
  push:

permissions:
  contents: read

concurrency:
  group: terraform-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "^1.11.0"
          terraform_wrapper: false

      - name: Check formatting
        run: terraform fmt -check -recursive -diff terraform

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        stack: [shared, dev, prod]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "^1.11.0"
          terraform_wrapper: false

      - name: Initialise (no backend)
        working-directory: terraform/envs/${{ matrix.stack }}
        run: terraform init -backend=false -input=false

      - name: Validate
        working-directory: terraform/envs/${{ matrix.stack }}
        run: terraform validate
