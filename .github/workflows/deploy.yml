name: Build and deploy

# main            -> prod (public site)
# any other branch -> dev  (dev.<domain>, behind Cloudflare Access, includes drafts)
# pull requests    -> build only
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# Read-only by default. Only the deploy job may request an OIDC token (see its own permissions block), so the build
# job, which runs Hugo and the theme's templates, can never assume the AWS role.
permissions:
  contents: read

env:
  # Upgrading Hugo changes both lines: the SHA-256 is the line for hugo_extended_<version>_linux-amd64.tar.gz in
  # hugo_<version>_checksums.txt on the release page.
  HUGO_VERSION: "0.166.0"
  HUGO_SHA256: "0e39b901e3f919f1daae05c8ff64f0c14c8a348ef46886d63f8e6d1bb2653885"

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      target: ${{ steps.target.outputs.target }}
    steps:
      - uses: actions/checkout@v7

      - name: Pick target environment
        id: target
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            target=none
          elif [ "$GITHUB_REF" = "refs/heads/main" ]; then
            target=prod
          else
            target=dev
          fi
          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "Target environment: $target" >> "$GITHUB_STEP_SUMMARY"

      - name: Install Hugo (checksum-verified)
        run: |
          set -euo pipefail
          f="hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          curl -fsSLO "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/$f"
          echo "$HUGO_SHA256  $f" | sha256sum -c -
          mkdir -p "$HOME/.local/hugo"
          tar -xzf "$f" -C "$HOME/.local/hugo" hugo
          rm "$f"
          echo "$HOME/.local/hugo" >> "$GITHUB_PATH"

      - name: Hugo version
        run: hugo version

      - name: Build (public)
        if: steps.target.outputs.target != 'dev'
        run: hugo --minify --gc

      - name: "Build (dev - drafts visible, noindex, dev URLs)"
        if: steps.target.outputs.target == 'dev'
        run: hugo --minify --gc --environment dev --buildDrafts --buildFuture

      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: public
          retention-days: 7

  deploy:
    # Dependabot's branches only build (its pull requests are the check); they never deploy.
    if: needs.build.outputs.target != 'none' && github.actor != 'dependabot[bot]'
    needs: build
    runs-on: ubuntu-latest
    # One deploy at a time per environment; a dev push never blocks a prod deploy.
    concurrency:
      group: deploy-${{ needs.build.outputs.target }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # needed for AWS OIDC
    env:
      # Repository variables and secrets are prefixed per environment: DEV_* and PROD_*
      PREFIX: ${{ needs.build.outputs.target == 'prod' && 'PROD' || 'DEV' }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: public

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          # A secret, not a variable, so the ARN (which contains the AWS account ID) is masked in public logs.
          role-to-assume: ${{ secrets[format('{0}_AWS_ROLE_ARN', env.PREFIX)] }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Sync to S3
        env:
          BUCKET: ${{ vars[format('{0}_S3_BUCKET', env.PREFIX)] }}
        run: |
          set -euo pipefail
          dest="s3://$BUCKET"

          # Fingerprinted assets (hash in the filename): safe to cache for a year. Uploaded first and without
          # --delete, so the old files stay until the new HTML that stops referencing them is in place (last pass).
          aws s3 sync public/ "$dest" \
            --exclude "*" --include "css/*" --include "images/*" \
            --cache-control "public, max-age=31536000, immutable"

          # Static files whose names never change: cache for a day.
          aws s3 sync public/ "$dest" --delete \
            --exclude "*" --include "fonts/*" --include "og/*" \
            --cache-control "public, max-age=86400"

          # Everything else (HTML, sitemap, feeds, robots.txt): browsers always revalidate,
          # CloudFront keeps it until the invalidation below.
          aws s3 sync public/ "$dest" --delete \
            --exclude "css/*" --exclude "images/*" --exclude "fonts/*" --exclude "og/*" \
            --cache-control "public, max-age=0, s-maxage=86400, must-revalidate"

          # Now that the HTML points at the new fingerprinted files, remove the old ones. Uploads nothing new.
          aws s3 sync public/ "$dest" --delete \
            --exclude "*" --include "css/*" --include "images/*" \
            --cache-control "public, max-age=31536000, immutable"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars[format('{0}_CLOUDFRONT_DISTRIBUTION_ID', env.PREFIX)] }}" \
            --paths "/*"
