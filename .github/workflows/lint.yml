name: Lint

# Static checks for the Terraform, the workflows and the scripts. No cloud credentials: nothing is planned or applied.
# On every push to any branch, like the Terraform checks: a pull request's head commit has always been pushed first, so
# these report on it. Tool versions are pinned; bump them deliberately.
on:
  push:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tflint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.66.0

      - name: Install plugins
        run: tflint --chdir=terraform --init --config="$GITHUB_WORKSPACE/terraform/.tflint.hcl"
        env:
          # Avoids GitHub API rate limits when downloading the AWS ruleset.
          GITHUB_TOKEN: ${{ github.token }}

      - name: Lint every Terraform directory
        run: tflint --chdir=terraform --recursive --config="$GITHUB_WORKSPACE/terraform/.tflint.hcl" --format=compact

  trivy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The image is used directly rather than through a setup action. Accepted findings are suppressed inline in the
      # Terraform with a reason (#trivy:ignore:...).
      - name: Scan the Terraform configuration
        run: >-
          docker run --rm -v "$PWD:/repo:ro" --workdir /repo aquasec/trivy:0.76.2
          config --quiet --exit-code 1 terraform/

  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Lint workflows
        run: docker run --rm -v "$PWD:/repo:ro" --workdir /repo rhysd/actionlint:1.7.12 -color

  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Offline: no token is passed, so the audits that query GitHub are skipped. Policy in .github/zizmor.yml.
      - name: Audit workflows
        run: docker run --rm -v "$PWD:/repo:ro" --workdir /repo ghcr.io/zizmorcore/zizmor:1.32.0 --offline --no-progress .

  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # ShellCheck is preinstalled on the runner.
      - name: Lint scripts
        run: shellcheck tools/*.sh
